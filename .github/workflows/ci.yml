name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  test:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
          - os: windows-2022
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libfontconfig-dev
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,tomllib; v=tomllib.load(open('Cargo.toml','rb'))['workspace']['package']['version']; assert os.environ['RELEASE_TAG']=='v'+v, 'Tag must match Cargo workspace version'"
      - run: python packaging/test_packaging.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - run: cargo test --workspace --target ${{ matrix.target }} --locked
      - run: cargo test -p ruffle_core --lib bitmap_cache_regression --target ${{ matrix.target }} --locked
      - if: runner.os == 'Linux'
        run: python3 tools/perf-sample-test.py
      - name: Build Linux executable
        if: runner.os == 'Linux'
        run: cargo build --locked --release --target ${{ matrix.target }} --bin zm-container
      - name: Package Windows executable
        if: runner.os == 'Windows'
        run: python packaging/build.py --platform windows
      - name: Package macOS application (ad-hoc signed test build)
        if: runner.os == 'macOS'
        run: python packaging/build.py --platform macos
      - uses: actions/upload-artifact@v4
        if: runner.os != 'Linux'
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.sha256
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        with:
          name: linux-release-binary
          if-no-files-found: error
          path: target/${{ matrix.target }}/release/zm-container

  appimage:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-binary
          path: target/release
      - run: chmod 0755 target/release/zm-container
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libfontconfig-dev
      - run: curl -L --fail -o /tmp/linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage && chmod 0755 /tmp/linuxdeploy.AppImage
      - run: SKIP_CARGO_BUILD=1 APPIMAGE_EXTRACT_AND_RUN=1 LINUXDEPLOY=/tmp/linuxdeploy.AppImage ./packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/ZM-Container-x86_64.AppImage
            dist/ZM-Container-x86_64.AppImage.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, appimage]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify all release artifacts
        working-directory: dist
        run: |
          test -f ZM-Container-x86_64.AppImage
          test -f ZM-Container-windows-x86_64.zip
          test -f ZM-Container-macos-arm64.dmg
          sha256sum --check --strict ./*.sha256
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --title "ZM-Container $RELEASE_TAG" \
            --notes-file packaging/RELEASE_NOTES.md
